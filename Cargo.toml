[package]
name         = "surefoot"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
description  = "A parallel directory walk that asks what it is standing on: thread count from the medium, adjusted while it runs."
repository   = "https://github.com/ReviseTouch/surefoot"
keywords     = ["walk", "directory", "filesystem", "parallel", "recursive"]
categories   = ["filesystem", "concurrency"]
publish      = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3"
